name: Update Profile Card

on:
  schedule:
    # 04:37 UTC daily. Odd minutes avoid the queue at the top of the hour.
    - cron: "37 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Lets the job push the regenerated SVGs back to the branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml python-dateutil

      - name: Generate card
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: djim97
        run: python today.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add light_mode.svg dark_mode.svg cache/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile card stats"
            git push
          fi